site_name: Ariadne Mail MCP
site_description: Local IMAP and SMTP via MCP
site_author: Ariadne Industries GmbH
copyright: Copyright (c) 2026 Ariadne Industries GmbH. Original BSD 3-Clause notices are in LICENSE and NOTICE.

nav:
  - Home: index.md
  - User setup: user-setup.md
  - Configuration reference: configuration.md
  - Administrator security: admin-security.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["mcp_email_server"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
